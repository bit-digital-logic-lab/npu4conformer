name: Offline engineering checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-checks.txt
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - run: python tools/check_repository.py
      - run: python tools/run_checks.py --suite python
      - run: python tools/run_checks.py --suite rtl
