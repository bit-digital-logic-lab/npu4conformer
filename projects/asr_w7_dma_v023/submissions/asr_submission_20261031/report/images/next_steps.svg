<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800"><rect width="1600" height="800" fill="white"/><style>text{font-family:'Noto Sans CJK SC';fill:#244656;font-size:30px}.s{font-size:26px;fill:#63737c}</style><text x="800" y="75" text-anchor="middle" font-size="36">整改目标  概念时序  待验证</text><text x="260" y="210" text-anchor="end">读DMA预取</text><rect x="320" y="155" width="220" height="90" fill="#E4F1F1" stroke="#658896" stroke-width="2"/><text x="430" y="210" text-anchor="middle">块 0</text><rect x="555" y="155" width="220" height="90" fill="#E4F1F1" stroke="#658896" stroke-width="2"/><text x="665" y="210" text-anchor="middle">块 1</text><rect x="790" y="155" width="220" height="90" fill="#E4F1F1" stroke="#658896" stroke-width="2"/><text x="900" y="210" text-anchor="middle">块 2</text><text x="260" y="340" text-anchor="end">矩阵计算</text><rect x="555" y="285" width="220" height="90" fill="#E7EFF5" stroke="#658896" stroke-width="2"/><text x="665" y="340" text-anchor="middle">块 0</text><rect x="790" y="285" width="220" height="90" fill="#E7EFF5" stroke="#658896" stroke-width="2"/><text x="900" y="340" text-anchor="middle">块 1</text><rect x="1025" y="285" width="220" height="90" fill="#E7EFF5" stroke="#658896" stroke-width="2"/><text x="1135" y="340" text-anchor="middle">块 2</text><text x="260" y="470" text-anchor="end">写DMA回传</text><rect x="790" y="415" width="220" height="90" fill="#F5EADC" stroke="#658896" stroke-width="2"/><text x="900" y="470" text-anchor="middle">块 0</text><rect x="1025" y="415" width="220" height="90" fill="#F5EADC" stroke="#658896" stroke-width="2"/><text x="1135" y="470" text-anchor="middle">块 1</text><rect x="1260" y="415" width="220" height="90" fill="#F5EADC" stroke="#658896" stroke-width="2"/><text x="1370" y="470" text-anchor="middle">块 2</text><text x="800" y="590" text-anchor="middle">同一时间列：读下一块  计算当前块  写回上一块</text><text x="800" y="660" text-anchor="middle" class="s">先解除收集与打包反压，再核验预取及写回重叠</text><text x="800" y="725" text-anchor="middle" class="s">验收：输出一致  握手字节可对账  有效计算与搬运重叠  完成周期减少</text></svg>