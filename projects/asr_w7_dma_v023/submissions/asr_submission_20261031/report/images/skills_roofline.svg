<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800"><rect width="1600" height="800" fill="white"/><style>text{font-family:'Noto Sans CJK SC';fill:#244656;font-size:30px}.s{font-size:26px;fill:#63737c}</style><rect x="60" y="110" width="430" height="225" fill="#F1F6F8" stroke="#658896" stroke-width="2"/><text x="275" y="175" text-anchor="middle" font-size="36">搬运账本 skill</text><text x="275" y="235" text-anchor="middle">统计实际读写 Q</text><text x="275" y="290" text-anchor="middle">本例 43,008 B</text><rect x="585" y="110" width="430" height="225" fill="#F1F6F8" stroke="#658896" stroke-width="2"/><text x="800" y="175" text-anchor="middle" font-size="36">活动波形 skill</text><text x="800" y="235" text-anchor="middle">确认完成窗口 T</text><text x="800" y="290" text-anchor="middle">本例 8,711 周期</text><rect x="1110" y="110" width="430" height="225" fill="#F1F6F8" stroke="#658896" stroke-width="2"/><text x="1325" y="175" text-anchor="middle" font-size="36">矩阵维度</text><text x="1325" y="235" text-anchor="middle">确定有用运算 N</text><text x="1325" y="290" text-anchor="middle">本例 393,216 OP</text><text x="800" y="440" text-anchor="middle" font-size="40">I = N / Q = 9.14 OP/B</text><text x="800" y="515" text-anchor="middle" font-size="40">P = N / T = 45.14 OP/周期</text><text x="800" y="620" text-anchor="middle">账本判断怎样少搬；波形查明哪里在等；Roofline显示改进方向</text><text x="800" y="710" text-anchor="middle" class="s">busy只表示模块忙；有效乘加及其与DMA的重叠需要独立事件记录</text></svg>